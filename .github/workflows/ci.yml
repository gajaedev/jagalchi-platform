name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Web, Mobile, and API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_REALTIME_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ENV: development
          NEXT_PUBLIC_API_MOCKING: "false"
          NEXT_PUBLIC_REALTIME_ENABLED: "false"

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jagalchi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jagalchi/web build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_MOCKING: "true"
          NEXT_PUBLIC_E2E_MOCKING: "true"
          NEXT_PUBLIC_REALTIME_ENABLED: "true"
          NEXT_PUBLIC_EVIDENCE_EXECUTION_ENABLED: "true"
          NEXT_PUBLIC_PROOF_PROFILE_ENABLED: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: pnpm --filter @jagalchi/web test:e2e
        env:
          E2E_USE_PRODUCTION_SERVER: "true"
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_API_MOCKING: "true"
          NEXT_PUBLIC_E2E_MOCKING: "true"
          NEXT_PUBLIC_REALTIME_ENABLED: "true"
          NEXT_PUBLIC_EVIDENCE_EXECUTION_ENABLED: "true"
          NEXT_PUBLIC_PROOF_PROFILE_ENABLED: "true"

  ai:
    name: Django AI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements.runtime.txt
            services/ai/requirements.txt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test jagalchi_ai.ai_core.tests
        env:
          DJANGO_SECRET_KEY: ci-only-django-secret-that-is-at-least-32-characters
          AI_AUTH_JWT_SECRET: ci-only-ai-auth-secret-that-is-at-least-32-characters
          AI_DISABLE_EXTERNAL: "true"

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_ACCESS_SECRET: ci-only-access-secret-that-is-at-least-32-characters
          AI_AUTH_JWT_SECRET: ci-only-ai-auth-secret-that-is-at-least-32-characters
          VERIFICATION_CODE_SECRET: ci-only-verification-secret-that-is-at-least-32-characters
          RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-secret-that-is-at-least-32-characters
          DJANGO_SECRET_KEY: ci-only-django-secret-that-is-at-least-32-characters
          OBJECT_STORAGE_BUCKET: jagalchi-ci
          OBJECT_STORAGE_ACCESS_KEY_ID: ci-only
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ci-only-storage-secret
          OBJECT_STORAGE_PUBLIC_BASE_URL: https://storage.example.com/jagalchi

  deployment-contract:
    name: Backend deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment scripts
        run: bash -n deploy/*.sh
      - name: Test CI decision gate
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Validate production Compose contract
        run: docker compose --env-file deploy/personal-server.env.example -f compose.production.yml --profile cloudflare-tunnel config --quiet
