name: jagalchi-platform

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://jagalchi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@api-db:5432/jagalchi
      DATABASE_SSL: "false"
      DATABASE_SYNCHRONIZE: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      AI_AUTH_JWT_SECRET: ${AI_AUTH_JWT_SECRET:?AI_AUTH_JWT_SECRET is required}
      VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:?VERIFICATION_CODE_SECRET is required}
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      EVIDENCE_EXECUTION_ENABLED: ${EVIDENCE_EXECUTION_ENABLED:-false}
      PUBLIC_PROOF_PROFILE_ENABLED: ${PUBLIC_PROOF_PROFILE_ENABLED:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_SETUP_URL: ${GITHUB_APP_SETUP_URL:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-jagalchi}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/jagalchi}
      IAP_ACCOUNT_BINDING_SECRET: ${IAP_ACCOUNT_BINDING_SECRET:-}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.jagalchi.app}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      EMAIL_DELIVERY_URL: ${EMAIL_DELIVERY_URL:-}
      EMAIL_DELIVERY_TOKEN: ${EMAIL_DELIVERY_TOKEN:-}
    depends_on:
      api-db:
        condition: service_healthy
      ai:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ai:
    build:
      context: services/ai
      dockerfile: Dockerfile
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: jagalchi_ai.settings
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      AI_AUTH_JWT_SECRET: ${AI_AUTH_JWT_SECRET:?AI_AUTH_JWT_SECRET is required}
      AI_DISABLE_EXTERNAL: ${AI_DISABLE_EXTERNAL:-true}
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: jagalchi_ai
      DATABASE_USER: jagalchi_ai
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_HOST: ai-db
      DATABASE_PORT: 5432
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ai-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ai/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  api-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jagalchi
      POSTGRES_USER: jagalchi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - api-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagalchi -d jagalchi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jagalchi_ai
      POSTGRES_USER: jagalchi_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagalchi_ai -d jagalchi_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-jagalchi}

volumes:
  api-postgres:
  ai-postgres:
  object-storage:
